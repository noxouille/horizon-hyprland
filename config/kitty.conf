# ============================================================================
# horizon - Kitty Terminal Colors (Light Theme)
# ============================================================================
# Include in your kitty.conf:
#   include horizon.conf
# ============================================================================

# Background and Foreground
background            #CDC9C2
foreground            #34322F
selection_background  #1E3A5F
selection_foreground  #FFFFFF

# Cursor
cursor                #1E3A5F
cursor_text_color     #CDC9C2

# URL color
url_color             #00473E

# Window borders
active_border_color   #1E3A5F
inactive_border_color #A19D96

# Tab bar
tab_bar_background    #CDC9C2
active_tab_background #BCB8B1
active_tab_foreground #1A1816
inactive_tab_background #C5C1BA
inactive_tab_foreground #57534D

# Normal colors (0-7)
color0  #34322F
color1  #9E1C1C
color2  #1C5E24
color3  #5C3A00
color4  #1E3A5F
color5  #571583
color6  #00473E
color7  #BCB8B1

# Bright colors (8-15)
color8  #57534D
color9  #A82222
color10 #2C6B30
color11 #6B4500
color12 #2D4A6E
color13 #65189A
color14 #005A4F
color15 #CDC9C2
