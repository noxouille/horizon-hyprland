# ============================================================================
# horizon - Hyprland Colors
# ============================================================================
# Source this file in your hyprland.conf:
#   source = ~/.config/colorschemes/horizon/hyprland/colors.conf
# ============================================================================

# Backgrounds (warm gray spectrum from Kai art)
$bg0 = rgb(CDC9C2)
$bg1 = rgb(C5C1BA)
$bg2 = rgb(BCB8B1)
$bg3 = rgb(B3AFA8)
$bg4 = rgb(A19D96)
$bg5 = rgb(837F79)

# Foregrounds (dark spectrum for light theme)
$fg0 = rgb(1A1816)
$fg1 = rgb(2A2826)
$fg2 = rgb(34322F)
$fg3 = rgb(4C4945)
$fg4 = rgb(57534D)
$fg5 = rgb(7A766F)

# Character Colors (enhanced for light theme)
$van = rgb(1E3A5F)
$kevin = rgb(1C5E24)
$rean = rgb(4A423B)
$agnes = rgb(8C0F45)
$emilia = rgb(F57F17)
$grandmaster = rgb(571583)
$laegjarn = rgb(005A4F)
$horizon = rgb(8A3100)
$aaron = rgb(9E1C1C)

# Semantic
$primary = $van
$secondary = $agnes
$accent = $laegjarn
$warning = $horizon
$error = $aaron
$success = $kevin
$info = $laegjarn

# Standard color aliases (for compatibility)
$blue = $van
$red = $aaron
$green = $kevin
$yellow = $emilia
$cyan = $laegjarn
$magenta = $grandmaster
$orange = $horizon

# With alpha (for rgba usage) - 80 = 50%, cc = 80%, 40 = 25%
$bg0_alpha = rgba(CDC9C280)
$bg1_alpha = rgba(C5C1BA80)
$bg2_alpha = rgba(BCB8B180)
$van_alpha = rgba(1E3A5F80)
$shadow = rgba(00000040)
